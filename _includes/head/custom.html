<!-- start custom head snippets -->

<!-- Preconnect and Load Modern Tech Fonts: Inter & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!-- Anti-Flicker Instant Theme Script -->
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('theme');
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var activeTheme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', activeTheme);
    } catch(e) {}
  })();
</script>

<style>
  /* Mermaid diagram styling */
  .mermaid {
    text-align: center;
    margin: 24px 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 20px;
    overflow-x: auto;
  }

  .mermaid svg {
    max-width: 100% !important;
    height: auto !important;
  }

  /* Ensure mermaid diagrams are visible */
  .language-mermaid {
    display: block !important;
    visibility: visible !important;
  }

  /* Dark mode support for mermaid diagrams */
  [data-theme="dark"] .mermaid,
  @media (prefers-color-scheme: dark) {
    [data-theme="dark"] .mermaid {
      background: #111827;
      border-color: #374151;
    }
  }
</style>

<!-- Reading progress indicator bar -->
<div id="reading-progress-bar" class="reading-progress-bar"></div>

<!-- end custom head snippets -->
